<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap");

      body {
        font-family: "Inter", system_ui, sans-serif;
      }

      .title-font {
        font-family: "Space Grotesk", sans-serif;
      }

      .glass {
        background: rgba(255, 254, 254, 0.97);
        backdrop-filter: blur(20px);
      }

      /* Responsive QR Code */
      #qrcode {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        padding: 20px;
        overflow: hidden;
      }

      #qrcode img,
      #qrcode canvas {
        max-width: 100% !important;
        height: auto !important;
        display: block;
      }

      /* Mobile Responsive */
      @media (max-width: 640px) {
        body {
          padding: 16px;
        }
        .glass > .p-10 {
          padding: 24px 18px;
        }
        #qrcode {
          padding: 12px;
        }

        #qr-section .flex.justify-center {
          flex-direction: column;
          gap: 12px;
        }

        #qr-section button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-br from-blue-50 via-blue-100 to-indigo-200 min-h-screen flex items-center justify-center p-6"
  >
    <div class="max-w-lg w-full">
      <!-- Header -->
      <div class="text-center mb-10">
        <div class="inline-flex items-center gap-3 mb-6">
          <div
            class="w-12 h-12 bg-indigo-600 text-white rounded-3xl flex items-center justify-center text-3xl shadow-inner"
          >
            <i class="fa-solid fa-qrcode"></i>
          </div>
          <h1
            class="title-font text-4xl font-semibold tracking-tighter text-slate-900"
          >
            QR Builder
          </h1>
        </div>
        <p class="text-slate-600">
          Create clean, fast and effective QR codes instantly
        </p>
      </div>

      <!-- Main Card -->
      <div
        class="glass rounded-3xl shadow-xl border border-slate-100 overflow-hidden"
      >
        <div class="p-10">
          <div class="space-y-8">
            <!-- Input -->
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-2"
                >Enter text or URL</label
              >
              <input
                type="text"
                id="text"
                placeholder="https://example.com or any message"
                class="w-full px-6 py-5 bg-white border border-slate-200 rounded-2xl text-lg focus:outline-none focus:border-indigo-500 transition-all"
                onkeypress="if (event.key === 'Enter') generateQRCode();"
              />
            </div>

            <!-- Compact Color Picker -->
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-3"
                >Pick a Color</label
              >
              <div class="flex gap-3">
                <button
                  onclick="setColor('#1e3a8a')"
                  class="w-6 h-6 rounded-2xl bg-blue-800 ring-2 ring-offset-2 ring-blue-200"
                ></button>
                <button
                  onclick="setColor('#166534')"
                  class="w-6 h-6 rounded-2xl bg-green-700"
                ></button>
                <button
                  onclick="setColor('#4f46e5')"
                  class="w-6 h-6 rounded-2xl bg-indigo-600"
                ></button>
                <button
                  onclick="setColor('#b91c1c')"
                  class="w-6 h-6 rounded-2xl bg-red-700"
                ></button>
                <button
                  onclick="setColor('#000000')"
                  class="w-6 h-6 rounded-2xl bg-black ring-2 ring-offset-2 ring-slate-300"
                ></button>
              </div>
            </div>

            <button
              onclick="generateQRCode()"
              class="w-full py-6 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold text-xl rounded-3xl flex items-center justify-center gap-3 transition-all active:scale-[0.985]"
            >
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              Generate QR Code
            </button>
          </div>

          <!-- QR Code -->
          <div id="qr-section" class="hidden mt-12 text-center">
            <div class="mb-6">
              <p class="text-sm font-medium text-slate-500">Your QR Code</p>
            </div>

            <div class="w-full flex justify-center">
              <div id="qrcode" class="bg-white rounded-3xl shadow-inner"></div>
            </div>

            <div class="flex justify-center gap-4 mt-10">
              <button
                onclick="downloadQR()"
                class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-medium flex items-center justify-center gap-2 hover:bg-black transition-colors"
              >
                <i class="fa-solid fa-download"></i>
                Download PNG
              </button>

              <button
                onclick="clearQR()"
                class="flex-1 py-4 border border-slate-300 text-slate-700 rounded-2xl font-medium hover:bg-slate-50 transition-colors"
              >
                Clear
              </button>
            </div>
          </div>
        </div>

        <div class="border-t border-slate-100 px-10 py-5 text-center">
          <button
            onclick="showHowItWorks()"
            class="text-indigo-600 hover:text-indigo-700 text-sm font-medium flex items-center gap-2 mx-auto"
          >
            <i class="fa-solid fa-circle-info"></i>
            How it works
          </button>
        </div>
      </div>
    </div>

    <!-- How it Works Modal -->
    <div
      id="info-modal"
      class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-3xl max-w-md w-full mx-4 p-8">
        <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
          <i class="fa-solid fa-circle-info text-indigo-600"></i>
          How QR Builder Works
        </h2>
        <div class="space-y-6 text-slate-600">
          <div class="flex gap-4">
            <div
              class="w-7 h-7 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center font-semibold text-sm"
            >
              1
            </div>
            <div>Enter any text, link, or message in the input field</div>
          </div>
          <div class="flex gap-4">
            <div
              class="w-7 h-7 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center font-semibold text-sm"
            >
              2
            </div>
            <div>Choose your preferred QR code color</div>
          </div>
          <div class="flex gap-4">
            <div
              class="w-7 h-7 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center font-semibold text-sm"
            >
              3
            </div>
            <div>Click Generate and download your high-quality QR code</div>
          </div>
        </div>
        <button
          onclick="hideHowItWorks()"
          class="mt-10 w-full py-4 bg-slate-900 text-white rounded-2xl font-medium"
        >
          Got it, thanks!
        </button>
      </div>
    </div>

    <script>
      let currentQR = null;
      let currentColor = "#1e3a8a";

      function setColor(color) {
        currentColor = color;
        if (currentQR) generateQRCode();
      }

      function generateQRCode() {
        const text = document.getElementById("text").value.trim();

        if (!text) {
          alert("Please enter some text or a URL");
          return;
        }

        const qrContainer = document.getElementById("qrcode");
        const qrSection = document.getElementById("qr-section");

        qrSection.classList.remove("hidden");

        qrContainer.innerHTML = "";

        // Calculate responsive QR size
        const availableWidth = qrContainer.parentElement.clientWidth;

        const qrSize = Math.min(300, Math.max(100, availableWidth - 40));

        // Generate QR Code
        currentQR = new QRCode(qrContainer, {
          text: text,
          width: qrSize,
          height: qrSize,
          colorDark: currentColor,
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H,
        });

        qrSection.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
        });
      }

      function downloadQR() {
        const canvas = document.querySelector("#qrcode canvas");
        if (!canvas) return;

        const link = document.createElement("a");
        link.download = "qrcode.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      function clearQR() {
        document.getElementById("qrcode").innerHTML = "";
        document.getElementById("qr-section").classList.add("hidden");
        document.getElementById("text").value = "";
        currentQR = null;
      }

      function showHowItWorks() {
        document.getElementById("info-modal").classList.remove("hidden");
      }

      function hideHowItWorks() {
        document.getElementById("info-modal").classList.add("hidden");
      }

      window.onload = () => {
        document.getElementById("text").focus();
      };
    </script>
  </body>
</html>
